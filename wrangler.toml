# Cloudflare Workers + static assets — required so CI `npx wrangler deploy` succeeds.
# (Dashboard is locked to that command; `wrangler pages deploy` is not used.)
name = "efthack-net"
main = "workers/site.js"
compatibility_date = "2026-09-12"

# Cloudflare CI invokes `npx wrangler deploy` directly. Build Astro first so
# the static-assets directory exists before Wrangler validates it.
[build]
command = "npm run build"

[[routes]]
pattern = "efthack.net"
custom_domain = true

[[routes]]
pattern = "www.efthack.net"
custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "drop-trailing-slash"
# SEO files (sitemap, robots, sitemap-index) run through the Worker for www + apex parity.
run_worker_first = [
  "/*",
  "!/favicon.svg",
  "!/_astro/*",
  "!/media/*",
  "!/videos/*",
  "!/og/*",
]
