# Cloudflare Workers + static assets — required so CI `npx wrangler deploy` succeeds.
# Worker name must match Workers Builds in the dashboard (eft-hack--net).
name = "eft-hack--net"
main = "workers/site.js"
compatibility_date = "2026-09-12"

# Cloudflare CI runs `npm run build` then `wrangler deploy`. Keep this for local deploys.
[build]
command = "npm run build"

# Zone routes (do not use custom_domain here — Wrangler would try to create DNS and
# fails with 100117 if apex/www already have manual A/CNAME records).
[[routes]]
pattern = "efthack.net/*"
zone_name = "efthack.net"

[[routes]]
pattern = "www.efthack.net/*"
zone_name = "efthack.net"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "drop-trailing-slash"
# SEO files (sitemap, robots, sitemap-index) run through the Worker for www + apex parity.
run_worker_first = [
  "/*",
  "!/favicon.svg",
  "!/robots.txt",
  "!/sitemap.xml",
  "!/sitemap-index.xml",
  "!/sitemap.css",
  "!/_astro/*",
  "!/media/*",
  "!/videos/*",
  "!/og/*",
]
